services:
      ican_srapper:
            build:
                  context: .
                  args:
                        UID: 1000
                        GID: 1000
            container_name: ican_scrapper
            restart: unless-stopped

            environment:
                  - TZ=Europe/Moscow

            env_file:
                  - .env

            volumes:
                  - ./data:/app/data